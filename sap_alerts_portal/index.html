<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול התראות SAP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f7fa; padding: 20px; display: flex; justify-content: center; }
        .form-container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #4a90e2; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ניהול מנויי התראות</h2>
    <form id="alertForm">
        <div class="form-group">
            <label for="executorSelect">מבצע הפעולה *</label>
            <select id="executorSelect" name="requesterEmail" required>
                <option value="">-- טוען רשימה... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="alertSelect">בחר התראה *</label>
            <select id="alertSelect" name="alertName" required>
                <option value="">-- טוען התראות... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="actionSelect">בחר פעולה *</label>
            <select id="actionSelect" name="action" required>
                <option value="">-- בחר פעולה --</option>
                <option value="ADD">הוספת נמען להתראה</option>
                <option value="REMOVE">הסרת נמען מהתראה</option>
                <option value="DISABLE">ביטול פעילות התראה</option>
            </select>
        </div>

        <div class="form-group" id="userGroup" style="display: none;">
            <label for="userSelect">משתמש להוספה/הורדה *</label>
            <select id="userSelect" name="userEmail">
                <option value="">-- טוען משתמשים... --</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn">בצע שינוי</button>
    </form>
</div>

<script>
    const alertsWebhook = "https://hook.eu1.make.com/da6jn8y8eospwzeh329t3544mh7jagr1";
    const usersWebhook = "https://hook.eu1.make.com/s78by5k7katgk4r3m2a32xaycu8bfexl";
    const executorsWebhook = "https://hook.eu1.make.com/9at7qjjd084f9wswq5igpic1ql3sg2o5";
    const actionWebhook = "https://hook.eu1.make.com/82p4t2c1bie1gu4ln1km7paf4sfoufd3";

    // לוגיקה להצגת שדה המשתמש לפי סוג הפעולה
    document.getElementById("actionSelect").addEventListener("change", function() {
        const userGroup = document.getElementById("userGroup");
        if (this.value === "ADD" || this.value === "REMOVE") {
            userGroup.style.display = "block";
        } else {
            userGroup.style.display = "none";
        }
    });

    // טעינת כל הנתונים בטעינת העמוד
    window.addEventListener("DOMContentLoaded", function() {
        // 1. טעינת מבצעי פעולה
        fetch(executorsWebhook).then(res => res.json()).then(data => {
            const el = document.getElementById("executorSelect");
            el.innerHTML = '<option value="">-- בחר מבצע פעולה --</option>';
            data.forEach(u => {
                const opt = document.createElement("option");
                opt.value = u.E_Mail;
                opt.textContent = u.u_name;
                el.appendChild(opt);
            });
        });

        // 2. טעינת התראות
        fetch(alertsWebhook).then(res => res.json()).then(data => {
            const el = document.getElementById("alertSelect");
            el.innerHTML = '<option value="">-- בחר התראה --</option>';
            data.forEach(i => {
                const opt = document.createElement("option");
                opt.value = i.Name;
                opt.textContent = i.Name;
                el.appendChild(opt);
            });
        });

        // 3. טעינת רשימת המשתמשים לשינוי
        fetch(usersWebhook).then(res => res.json()).then(data => {
            const el = document.getElementById("userSelect");
            el.innerHTML = '<option value="">-- בחר משתמש --</option>';
            data.forEach(u => {
                const opt = document.createElement("option");
                opt.value = u.E_Mail;
                opt.textContent = u.u_name;
                el.appendChild(opt);
            });
        });
    });

    // שליחת הטופס
    document.getElementById("alertForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this).entries());
        fetch(actionWebhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
        .then(res => alert(res.ok ? "הפעולה בוצעה!" : "שגיאה בביצוע"));
    });
</script>
</body>
</html>
