<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל שכר - ריכוז בקשות עובדים</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --border-color: #ccc;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .fieldset-container {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }

        /* מוסתר כברירת מחדל */
        #newEmployeeSection {
            display: none; 
            border-color: #f39c12; 
            background-color: #fafafa;
        }

        .fieldset-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        .file-inputs input {
            margin-bottom: 8px;
            display: block;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .note {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .alert-message {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .alert-success {
            background-color: #e8f8f5;
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .alert-error {
            background-color: #fceae8;
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>פורטל שכר - הגשת בקשה</h2>
    
    <div id="alertBox" class="alert-message"></div>
    
    <form id="payrollForm" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="employeeName">שם העובד/ת *</label>
            <select id="employeeName" name="employeeName" required onchange="checkNewEmployeeCSS(this.value)">
                <option value="">-- טוען רשימת עובדים... --</option>
            </select>
        </div>

        <div id="newEmployeeSection" class="fieldset-container">
            <div class="fieldset-title" style="color: #e67e22;">רישום עובד חדש במערכת *</div>
            <p style="margin: 0 0 12px 0; font-size: 13px; color: #666;">השם שלך לא נמצא ברשימה? מלא את פרטייך כאן והמערכת תעדכן אותך אוטומטית בפעם הבאה.</p>
            <div class="form-group">
                <label for="newEmployeeName">שם מלא בעברית *</label>
                <input type="text" id="newEmployeeName" name="newEmployeeName" placeholder="לדוגמה: ישראל ישראלי">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="newEmployeeEmail">כתובת מייל לקבלת עדכונים *</label>
                <input type="email" id="newEmployeeEmail" name="newEmployeeEmail" placeholder="username@pngroup.co.il">
            </div>
        </div>

        <div class="form-group">
            <label for="requestSubject">נושא הבקשה *</label>
            <select id="requestSubject" name="requestSubject" required onchange="toggleSections()">
                <option value="">-- נא לבחור נושא --</option>
                <option value="טופס 106">טופס 106</option>
                <option value="תלוש שכר">בקשת תלושי שכר</option>
                <option value="הערה / בקשה כללית">הערה / בקשה כללית</option>
            </select>
        </div>

        <div id="section106" class="fieldset-container" style="display: none;">
            <div class="fieldset-title">פרטי בקשת טופס 106</div>
            <div class="row">
                <div class="col">
                    <label for="form106StartYear">משנה</label>
                    <select id="form106StartYear" name="form106StartYear">
                        <option value="">בחר שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                    </select>
                </div>
                <div class="col">
                    <label for="form106EndYear">עד שנה</label>
                    <select id="form106EndYear" name="form106EndYear">
                        <option value="">בחר שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="sectionSlips" class="fieldset-container" style="display: none;">
            <div class="fieldset-title">פרטי בקשת תלושי שכר</div>
            
            <p style="margin: 0 0 10px 0; font-size: 13px; font-weight: bold;">מחודש ושנה:</p>
            <div class="row" style="margin-bottom: 10px;">
                <div class="col">
                    <select id="slipStartMonth" name="slipStartMonth">
                        <option value="">חודש</option>
                        <option value="01">ינואר (01)</option>
                        <option value="02">פברואר (02)</option>
                        <option value="03">מרץ (03)</option>
                        <option value="04">אפריל (04)</option>
                        <option value="05">מאי (05)</option>
                        <option value="06">יוני (06)</option>
                        <option value="07">יולי (07)</option>
                        <option value="08">אוגוסט (08)</option>
                        <option value="09">ספטמבר (09)</option>
                        <option value="10">אוקטובר (10)</option>
                        <option value="11">נובמבר (11)</option>
                        <option value="12">דצמבר (12)</option>
                    </select>
                </div>
                <div class="col">
                    <select id="slipStartYear" name="slipStartYear">
                        <option value="">שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
            </div>

            <p style="margin: 10px 0 10px 0; font-size: 13px; font-weight: bold;">עד חודש ושנה:</p>
            <div class="row">
                <div class="col">
                    <select id="slipEndMonth" name="slipEndMonth">
                        <option value="">חודש</option>
                        <option value="01">ינואר (01)</option>
                        <option value="02">פברואר (02)</option>
                        <option value="03">מרץ (03)</option>
                        <option value="04">אפריל (04)</option>
                        <option value="05">מאי (05)</option>
                        <option value="06">יוני (06)</option>
                        <option value="07">יולי (07)</option>
                        <option value="08">אוגוסט (08)</option>
                        <option value="09">ספטמבר (09)</option>
                        <option value="10">אוקטובר (10)</option>
                        <option value="11">נובמבר (11)</option>
                        <option value="12">דצמבר (12)</option>
                    </select>
                </div>
                <div class="col">
                    <select id="slipEndYear" name="slipEndYear">
                        <option value="">שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="generalRequests">תוכן הבקשה / פירוט נוסף</label>
            <textarea id="generalRequests" name="generalRequests" placeholder="פרט כאן את בקשתך..."></textarea>
        </div>

        <div class="form-group">
            <label>צירוף מסמכים / קבצים (עד 3 קבצים)</label>
            <div class="file-inputs">
                <input type="file" name="file1">
                <input type="file" name="file2">
                <input type="file" name="file3">
            </div>
            <div class="note">ניתן לצרף קבצי PDF, תמונות וכד' הרלוונטיים לבקשה.</div>
        </div>

        <button type="submit" id="submitBtn">שלח בקשה לפורטל</button>
    </form>
</div>

<script>
    const SPREADSHEET_ID = "1k3kyQX2usPvs5xe6q1203CUZS1rcRQcp2E_H8CMVu8M"; 
    const SHEET_GID = "1812873594"; 
    
    window.addEventListener("DOMContentLoaded", function() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;
        const employeeSelect = document.getElementById("employeeName");

        fetch(url)
            .then(response => response.text())
            .then(txt => {
                const jsonString = txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1);
                const json = JSON.parse(jsonString);
                const rows = json.table.rows;
                
                employeeSelect.innerHTML = '<option value="">-- נא לבחור שם מהרשימה --</option>';
                
                // מערך זמני שיכיל את כל השמות שחזרו מגוגל שיטס
                let namesArray = [];
                
                rows.forEach(row => {
                    if (row.c && row.c[0] && row.c[0].v) {
                        const name = row.c[0].v.toString().trim();
                        if (name && name !== "שם עובד" && name !== "שם העובד") {
                            namesArray.push(name);
                        }
                    }
                });

                // מיון חכם מותאם לעברית (Locale-aware sort)
                namesArray.sort((a, b) => a.localeCompare(b, 'he'));

                // הזרקת השמות הממוינים לתוך ה-Dropdown
                namesArray.forEach(name => {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    employeeSelect.appendChild(option);
                });

                // הוספת האופציה הקבועה של עובד חדש בסוף הרשימה (כדי שלא תתמיין באמצע)
                const newEmpOption = document.createElement("option");
                newEmpOption.value = "__NEW_EMPLOYEE__";
                newEmpOption.textContent = "עובד חדש / השם שלי לא מופיע";
                employeeSelect.appendChild(newEmpOption);
            })
            .catch(error => {
                console.error("Error loading employees:", error);
                employeeSelect.innerHTML = '<option value="">שגיאה בטעינת עובדים, נא לרענן</option>';
            });
    });

    function checkNewEmployeeCSS(val) {
        var section = document.getElementById("newEmployeeSection");
        var newNameInput = document.getElementById("newEmployeeName");
        var newEmailInput = document.getElementById("newEmployeeEmail");

        if (val === "__NEW_EMPLOYEE__") {
            section.style.display = "block";
            newNameInput.required = true;
            newEmailInput.required = true;
        } else {
            section.style.display = "none";
            newNameInput.required = false;
            newEmailInput.required = false;
            newNameInput.value = "";
            newEmailInput.value = "";
        }
    }

    function toggleSections() {
        var subject = document.getElementById("requestSubject").value;
        var section106 = document.getElementById("section106");
        var sectionSlips = document.getElementById("sectionSlips");

        section106.style.display = "none";
        sectionSlips.style.display = "none";

        if (subject === "טופס 106") {
            section106.style.display = "block";
        } else if (subject === "תלוש שכר") {
            sectionSlips.style.display = "block";
        }
    }

    document.getElementById("payrollForm").addEventListener("submit", function(event) {
        event.preventDefault();

        var form = event.target;
        var submitBtn = document.getElementById("submitBtn");
        var alertBox = document.getElementById("alertBox");
        var formData = new FormData(form);

        submitBtn.disabled = true;
        submitBtn.innerText = "שולח בקשה...";
        alertBox.style.display = "none";
        alertBox.className = "alert-message";

        fetch("https://hook.eu1.make.com/2d79o32chny5995mdvvc3ok2pa9ov236", {
            method: "POST",
            body: formData
        })
        .then(function(response) {
            if (response.ok) {
                alertBox.innerText = "הבקשה נשלחה בהצלחה! הנתונים הוכנסו לפורטל.";
                alertBox.classList.add("alert-success");
                alertBox.style.display = "block";
                form.reset();
                toggleSections();
                checkNewEmployeeCSS(""); 
            } else {
                throw new Error("Server error");
            }
        })
        .catch(function(error) {
            alertBox.innerText = "חלה שגיאה בשליחת הנתונים. אנא נסה שנית או פנה לעדי.";
            alertBox.classList.add("alert-error");
            alertBox.style.display = "block";
        })
        .finally(function() {
            submitBtn.disabled = false;
            submitBtn.innerText = "שלח בקשה לפורטל";
        });
    });
</script>

</body>
</html>
