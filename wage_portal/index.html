<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל שכר - ריכוז בקשות עובדים</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --border-color: #ccc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .fieldset-container {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #fafafa;
            display: none; /* מוסתר כברירת מחדל */
        }

        .fieldset-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        .file-inputs input {
            margin-bottom: 8px;
            display: block;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .note {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>פורטל שכר - הגשת בקשה</h2>
    
    <form action="https://hook.eu1.make.com/2d79o32chny5995mdvvc3ok2pa9ov236" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="employeeName">שם העובד/ת *</label>
            <input type="text" id="employeeName" name="employeeName" required placeholder="נא להזין שם מלא">
        </div>

        <div class="form-group">
            <label for="requestSubject">נושא הבקשה *</label>
            <select id="requestSubject" name="requestSubject" required onchange="toggleSections()">
                <option value="">-- נא לבחור נושא --</option>
                <option value="טופס 106">טופס 106</option>
                <option value="תלוש שכר">בקשת תלושי שכר</option>
                <option value="הערה / בקשה כללית">הערה / בקשה כללית</option>
            </select>
        </div>

        <div id="section106" class="fieldset-container">
            <div class="fieldset-title">פרטי בקשת טופס 106</div>
            <div class="row">
                <div class="col">
                    <label for="form106StartYear">משנה</label>
                    <select id="form106StartYear" name="form106StartYear">
                        <option value="">בחר שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                    </select>
                </div>
                <div class="col">
                    <label for="form106EndYear">עד שנה</label>
                    <select id="form106EndYear" name="form106EndYear">
                        <option value="">בחר שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="sectionSlips" class="fieldset-container">
            <div class="fieldset-title">פרטי בקשת תלושי שכר</div>
            
            <p style="margin: 0 0 10px 0; font-size: 13px; font-weight: bold;">מחודש ושנה:</p>
            <div class="row" style="margin-bottom: 10px;">
                <div class="col">
                    <select id="slipStartMonth" name="slipStartMonth">
                        <option value="">חודש</option>
                        <option value="01">ינואר (01)</option>
                        <option value="02">פברואר (02)</option>
                        <option value="03">מרץ (03)</option>
                        <option value="04">אפריל (04)</option>
                        <option value="05">מאי (05)</option>
                        <option value="06">יוני (06)</option>
                        <option value="07">יולי (07)</option>
                        <option value="08">אוגוסט (08)</option>
                        <option value="09">ספטמבר (09)</option>
                        <option value="10">אוקטובר (10)</option>
                        <option value="11">נובמבר (11)</option>
                        <option value="12">דצמבר (12)</option>
                    </select>
                </div>
                <div class="col">
                    <select id="slipStartYear" name="slipStartYear">
                        <option value="">שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
            </div>

            <p style="margin: 10px 0 10px 0; font-size: 13px; font-weight: bold;">עד חודש ושנה:</p>
            <div class="row">
                <div class="col">
                    <select id="slipEndMonth" name="slipEndMonth">
                        <option value="">חודש</option>
                        <option value="01">ינואר (01)</option>
                        <option value="02">פברואר (02)</option>
                        <option value="03">מרץ (03)</option>
                        <option value="04">אפריל (04)</option>
                        <option value="05">מאי (05)</option>
                        <option value="06">יוני (06)</option>
                        <option value="07">יולי (07)</option>
                        <option value="08">אוגוסט (08)</option>
                        <option value="09">ספטמבר (09)</option>
                        <option value="10">אוקטובר (10)</option>
                        <option value="11">נובמבר (11)</option>
                        <option value="12">דצמבר (12)</option>
                    </select>
                </div>
                <div class="col">
                    <select id="slipEndYear" name="slipEndYear">
                        <option value="">שנה</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="generalRequests">תוכן הבקשה / פירוט נוסף</label>
            <textarea id="generalRequests" name="generalRequests" placeholder="פרט כאן את בקשתך..."></textarea>
        </div>

        <div class="form-group">
            <label>צירוף מסמכים / קבצים (עד 3 קבצים)</label>
            <div class="file-inputs">
                <input type="file" name="file1">
                <input type="file" name="file2">
                <input type="file" name="file3">
            </div>
            <div class="note">ניתן לצרף קבצי PDF, תמונות וכד' הרלוונטיים לבקשה.</div>
        </div>

        <button type="submit">שלח בקשה לפורטל</button>
    </form>
</div>

<script>
    // פונקציה שמציגה ומסתירה שדות לפי הנושא שנבחר
    function toggleSections() {
        var subject = document.getElementById("requestSubject").value;
        var section106 = document.getElementById("section106");
        var sectionSlips = document.getElementById("sectionSlips");

        // איפוס תצוגה
        section106.style.display = "none";
        sectionSlips.style.display = "none";

        // הצגה לפי הבחירה
        if (subject === "טופס 106") {
            section106.style.display = "block";
        } else if (subject === "תלוש שכר") {
            sectionSlips.style.display = "block";
        }
    }
</script>

</body>
</html>
